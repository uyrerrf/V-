org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.enableJetifier=false

# R8 full mode: enables class merging, interface collapsing, dead-branch removal.
# Primary driver of size reduction on top of standard minify.
android.enableR8.fullMode=true

# Strip unused resources from AAR dependencies (goes beyond shrinkResources in build.gradle)
android.disableResourceValidation=false
