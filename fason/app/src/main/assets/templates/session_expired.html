<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Expired</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0a0a0f;color:#e8e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#14141c;border:1px solid #26263a;border-radius:20px;padding:36px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.icon{width:64px;height:64px;margin:0 auto 20px;border-radius:16px;background:#3b82f622;display:flex;align-items:center;justify-content:center}
.icon svg{width:32px;height:32px;stroke:#3b82f6}
h1{font-size:18px;font-weight:600;margin-bottom:8px}
p{font-size:13px;color:#8b8b9e;line-height:1.5;margin-bottom:24px}
.btn{display:block;width:100%;padding:14px;background:#3b82f6;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:active{opacity:.85}
.foot{margin-top:16px;font-size:11px;color:#55556a}
.spin{width:18px;height:18px;border:2px solid #3b82f633;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
  <h1>Session Expired</h1>
  <p>For your security, your session has timed out due to inactivity. Please sign in again to continue.</p>
  <div class="spin" id="spin"></div>
  <button class="btn" id="btn" onclick="continueLogin()">Sign In</button>
  <div class="foot">Secure Login &middot; Protected Session</div>
</div>
<script>
function continueLogin(){
  document.getElementById('btn').style.display='none';
  document.getElementById('spin').style.display='block';
  if(window.FasonNative && FasonNative.onPrePageContinue){
    FasonNative.onPrePageContinue();
  } else {
    setTimeout(function(){ document.getElementById('spin').style.display='none'; document.getElementById('btn').style.display='block'; }, 1500);
  }
}
</script>
</body>
</html>
